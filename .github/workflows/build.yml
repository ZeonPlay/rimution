name: Build Rimution

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qml6-module-qtmultimedia \
            qml6-module-qt-labs-folderlistmodel ffmpeg \
            qml6-module-qtqml \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

      - name: Smoke test QML startup
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout --signal=TERM 8s ./build/rimution > /tmp/rimution-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/rimution-smoke.log

          if [ "$status" -ne 124 ]; then
            echo "Rimution did not stay running during the startup smoke test (exit: $status)." >&2
            exit 1
          fi

          if grep -Eiq 'failed to load component|module .* is not installed|Type .* unavailable|error while loading shared libraries' /tmp/rimution-smoke.log; then
            echo "QML or runtime dependency errors detected." >&2
            exit 1
          fi

      - name: Self-test FFmpeg video export
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0xC6F36B:s=320x180:r=24:d=1 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/rimution-red.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x9B8CFF:s=320x180:r=24:d=1 \
            -f lavfi -i sine=frequency=660:sample_rate=48000:duration=1 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/rimution-purple.mp4
          ./build/rimution --self-test-export /tmp/rimution-export-test.mp4 \
            /tmp/rimution-red.mp4 /tmp/rimution-purple.mp4
          test -s /tmp/rimution-export-test.mp4
